# MowBite Updater: updates OpenMower, MowBite, the MowBite Planner and any app labelled mowbite.update=on, by hand on its
# page or by itself at night, only while the mower is idle in its dock. its page: http://<your-mower>:8083
services:
  updater:
    image: ghcr.io/mkaaaaaay/mowbite-updater:latest
    container_name: mowbite-updater
    restart: unless-stopped
    # on the mower's own network: its page on the mower's address, the mower's mqtt broker on localhost
    network_mode: host
    # its log in docker kept small, the mower's disk is
    logging:
      options:
        max-size: 1m
        max-file: "2"
    # all optional
    # environment:
    #   PORT: "8083"
    #   MQTT_HOST: 127.0.0.1
    #   MQTT_PORT: "1883"
    #   MQTT_USER: ""
    #   MQTT_PASSWORD: ""
    #   MQTT_PREFIX: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # the stacks at the same path inside: /opt/stacks is dockge's, change both sides if yours is elsewhere
      - /opt/stacks:/opt/stacks
      - /etc/localtime:/etc/localtime:ro
      # tells OpenMowerOS 3, where OpenMower comes with the os
      - /etc/os-release:/host/os-release:ro
    # shows up on the openmower start page
    labels:
      openmower.ui: "true"
      openmower.ui.name: MowBite Updater
      openmower.ui.port: "8083"
      openmower.ui.icon: SystemUpdateAlt
      openmower.ui.description: Updates OpenMower, MowBite, the planner and other apps, with the mower idle in the dock
