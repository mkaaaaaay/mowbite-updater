name: image

on:
  push:
    branches: [main]
    tags: ['v*']
    # (nothing that goes into the image: the readme, the license, the tests, its compose.yaml or this workflow. no new
    # image, every updater would update to the same)
    paths-ignore: ['README.md', 'LICENSE', '.gitignore', '.github/**', 'test/**', 'compose.yaml']
  workflow_dispatch:

# (a push while the one before still runs: that one stops, an older one never goes out after a newer one)
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # only once the checks and the tests went through: the updaters on the mowers take it from here
  image:
    needs: [check, test]
    runs-on: ubuntu-latest
    # (only this job writes to the registry)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/mowbite-updater
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:v0.11.0 -s sh -e SC1091,SC3043,SC2034,SC2015,SC2016,SC2153 /mnt/updater.sh /mnt/lib.sh /mnt/self.sh /mnt/www/cgi-bin/updater /mnt/www/cgi-bin/index.cgi /mnt/test/run.sh
      - run: node --check www/app.js

  # the updater against a made-up mower on the runner's docker: its interface, update and back, a version that doesn't
  # start, the mower out, stopped halfway, picked apps, stable, OpenMower with its .env and the planner built on it, the
  # night, a registry without an answer, making room, builds, itself and a broken version of itself. about 45 minutes,
  # most of it waiting for versions that don't start
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - run: sh test/run.sh
