name: check

# on every push and pull request, also the ones that build no image (image.yml leaves out the readme, the tests,
# compose.yaml and the workflows): shellcheck, the page, compose.yaml with the image, name and port the mowers know, and
# image.yml still waiting for the checks and the tests. the commits of a push (a pull request has no secrets)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh test/static.sh

  commits:
    if: github.event_name == 'push'
    uses: ./.github/workflows/commits.yml
    secrets:
      COMMIT_RULES: ${{ secrets.COMMIT_RULES }}
